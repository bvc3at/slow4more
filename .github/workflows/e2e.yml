name: E2E

# Not on every push: the run takes minutes and installs the latest Claude
# Code from npm, so it can fail for upstream reasons unrelated to a change.
# The weekly run is what catches those upstream breakages.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/e2e/Dockerfile -t slow4more-test .
      - run: docker run --rm --network none slow4more-test
